<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <!-- Dark background -->
  <rect width="32" height="32" rx="7" fill="#0d1224"/>
  <!-- Neural network — three connected nodes -->
  <line x1="16" y1="9"  x2="7"  y2="24" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="16" y1="9"  x2="25" y2="24" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <line x1="7"  y1="24" x2="25" y2="24" stroke="url(#g)" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
  <!-- Mid-edge connector dots -->
  <circle cx="11.5" cy="16.5" r="1.2" fill="url(#g)" opacity="0.5"/>
  <circle cx="20.5" cy="16.5" r="1.2" fill="url(#g)" opacity="0.5"/>
  <circle cx="16"   cy="24"   r="1.2" fill="url(#g)" opacity="0.5"/>
  <!-- Main nodes -->
  <circle cx="16" cy="9"  r="3" fill="url(#g)"/>
  <circle cx="7"  cy="24" r="3" fill="url(#g)"/>
  <circle cx="25" cy="24" r="3" fill="url(#g)"/>
</svg>
